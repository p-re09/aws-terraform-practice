name: Terraform CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_pair_name: ${{ secrets.TF_KEY_PAIR_NAME }}
      TF_VAR_my_ip_cidr: ${{ secrets.TF_MY_IP_CIDR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      # Always runs on every push - this is the safe, automatic part.
      - name: Terraform plan
        if: github.event_name == 'push' || github.event.inputs.action == 'plan'
        run: terraform plan

      # Only runs when someone manually triggers the workflow and chooses "apply".
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve

      # Only runs when someone manually triggers the workflow and chooses "destroy".
      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
